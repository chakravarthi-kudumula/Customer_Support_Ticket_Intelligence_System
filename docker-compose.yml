services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ticket-intelligence-api:latest
    container_name: ticket-intelligence-api
    ports:
      - "8000:8000"
    environment:
      API_CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: ticket-intelligence-ui:latest
    container_name: ticket-intelligence-ui
    ports:
      - "8501:8501"
    environment:
      TICKET_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
